name: Live site health

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/site-health.yml
      - scripts/check-live-site.mjs
      - lib/site-health.mjs

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check the public production website
        run: node scripts/check-live-site.mjs --output outputs/site-health.json
      - name: Keep public HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-health
          path: outputs/site-health.json
          retention-days: 90
          if-no-files-found: warn
